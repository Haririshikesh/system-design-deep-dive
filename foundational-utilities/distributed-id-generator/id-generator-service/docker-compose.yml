version: '3.8'

services:
  # ─── ZooKeeper: Coordination & Worker ID registry ───────────────────────────
  zookeeper:
    image: zookeeper:3.9.1
    container_name: idgen-zookeeper
    ports:
      - "2181:2181"
    environment:
      - ZOO_TICK_TIME=2000
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ZooKeeper Navigator UI (inspect ZK nodes in browser) ───────────────────
  zk-navigator:
    image: elkozmon/zoonavigator:latest
    container_name: idgen-zk-navigator
    ports:
      - "9000:9000"
    environment:
      - HTTP_PORT=9000
    depends_on:
      - zookeeper

  # ─── ID Generator Node 1 ─────────────────────────────────────────────────────
  id-generator-1:
    build: .
    container_name: idgen-node-1
    ports:
      - "8083:8083"
    environment:
      - WORKER_ID=1
      - DATACENTER_ID=1
    depends_on:
      - zookeeper

  # ─── ID Generator Node 2 ─────────────────────────────────────────────────────
  id-generator-2:
    build: .
    container_name: idgen-node-2
    ports:
      - "8084:8083"
    environment:
      - WORKER_ID=2
      - DATACENTER_ID=1
    depends_on:
      - zookeeper

volumes:
  zookeeper_data:
    driver: local
  zookeeper_datalog:
    driver: local